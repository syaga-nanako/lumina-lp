<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登録処理中…</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:sans-serif;background:#fdfaf3;color:#2c2246;}
  p{margin:0;letter-spacing:.08em;}
</style>
</head>
<body>
<p>登録処理中です…</p>
<form id="go" method="post" action="">
  <input type="hidden" name="mail" id="mail" value="">
  <input type="hidden" name="rid" value="">
</form>
<script>
(function () {
  /* UTAGE同ドメイン上なので store?mtid= だけで経路が付く。
     register 温存を重ねると LP_ad2/LP_ad2 のように二重になるため使わない。 */
  var q = new URLSearchParams(location.search);
  var mail = String(q.get('mail') || '').trim();
  var mtid = String(q.get('mtid') || '').trim();
  var store = String(q.get('store') || '').trim();

  if (!mail || !store) {
    document.querySelector('p').textContent = '登録情報が不足しています。LPからやり直してください。';
    return;
  }

  var form = document.getElementById('go');
  document.getElementById('mail').value = mail;

  try {
    var u = new URL(store, location.href);
    if (mtid) u.searchParams.set('mtid', mtid);
    form.action = u.toString();
  } catch (err) {
    form.action = store;
  }

  form.submit();
})();
</script>
</body>
</html>
